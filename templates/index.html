<!DOCTYPE html>
<html>
<head>
    <title>OTP Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">OTP Automation Tool</h1>

        <!-- API Key -->
        <div class="bg-white p-4 rounded shadow mb-6">
            <input type="password" id="api_key" placeholder="Enter API Key" class="border p-2 w-full rounded">
        </div>

        <!-- Get Number -->
        <div class="bg-white p-4 rounded shadow mb-6">
            <h2 class="font-semibold mb-2">Get Number</h2>
            <input type="text" id="service_id" placeholder="Service ID" class="border p-2 w-full rounded mb-2">
            <button onclick="getNumber()" class="bg-green-500 text-white px-4 py-2 rounded w-full">Get New Number</button>
        </div>

        <!-- Numbers List -->
        <div class="bg-white p-4 rounded shadow">
            <h2 class="font-semibold mb-4">Your Numbers</h2>
            {% for num in numbers %}
            <div class="border p-3 rounded mb-3">
                <p><strong>Phone:</strong> {{ num.phone }}</p>
                <p><strong>Operator:</strong> {{ num.operator }}</p>
                <p><strong>Status:</strong> {{ num.status }}</p>
                <button class="bg-red-500 text-white px-3 py-1 rounded mt-2">Cancel</button>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        async function getNumber() {
            const apiKey = document.getElementById('api_key').value;
            const service = document.getElementById('service_id').value;
            const res = await fetch('/get_number', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({api_key: apiKey, service: service})
            });
            const data = await res.json();
            alert(JSON.stringify(data));
            location.reload();
        }
    </script>
</body>
</html>
