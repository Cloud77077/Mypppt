<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white">
    <div class="max-w-5xl mx-auto p-6">
        <h1 class="text-3xl font-bold mb-8">OTP Automation Tool</h1>

        <!-- API Key -->
        <div class="bg-zinc-900 p-5 rounded-2xl mb-8">
            <input type="password" id="api_key" placeholder="Enter API Key" 
                   class="w-full bg-zinc-950 border border-zinc-700 p-3 rounded-xl">
        </div>

        <!-- Services + Get Number -->
        <div class="grid md:grid-cols-2 gap-6 mb-10">
            
            <!-- Load Services -->
            <div class="bg-zinc-900 p-5 rounded-2xl">
                <h2 class="font-semibold mb-3">1. Services</h2>
                <button onclick="loadServices()" 
                        class="w-full bg-zinc-800 hover:bg-zinc-700 py-2.5 rounded-xl mb-3">Load Services</button>
                <input type="text" id="search_service" placeholder="Search services..." 
                       class="w-full bg-zinc-950 border border-zinc-700 p-3 rounded-xl mb-3">
                <div id="services_list" class="max-h-60 overflow-auto text-sm"></div>
            </div>

            <!-- Get Number -->
            <div class="bg-zinc-900 p-5 rounded-2xl">
                <h2 class="font-semibold mb-3">2. Get Number</h2>
                <input type="text" id="service_id" placeholder="Service ID" 
                       class="w-full bg-zinc-950 border border-zinc-700 p-3 rounded-xl mb-3">
                <div class="flex gap-3">
                    <button onclick="getNumber()" 
                            class="flex-1 bg-emerald-600 hover:bg-emerald-700 py-2.5 rounded-xl">Get Number</button>
                    <button onclick="autoRetry()" 
                            class="flex-1 bg-zinc-700 hover:bg-zinc-600 py-2.5 rounded-xl">Auto Retry</button>
                </div>
            </div>
        </div>

        <!-- Your Numbers -->
        <div class="bg-zinc-900 p-6 rounded-2xl">
            <h2 class="text-xl font-semibold mb-6">Your Numbers</h2>
            
            {% for num in numbers %}
            <div class="border border-zinc-700 rounded-2xl p-5 mb-5">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <p class="font-semibold text-lg">{{ num.phone }}</p>
                        <p class="text-sm text-zinc-400">Service: {{ num.service }} | {{ num.operator }}</p>
                    </div>

                    {% if num.screenshot %}
                    <div class="w-full md:w-40">
                        <img src="data:image/png;base64,{{ num.screenshot }}" 
                             class="rounded-xl border border-zinc-600 cursor-pointer" 
                             onclick="window.open('https://www.rebtel.com/en/recharge/india/products?msisdn=+91{{ num.phone[2:] if num.phone.startswith('+91') else num.phone }}', '_blank')">
                    </div>
                    {% endif %}
                </div>

                <div class="mt-4 flex flex-wrap gap-2">
                    <button onclick="checkOTP('{{ num.activation_id }}')" 
                            class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-2 rounded-xl text-sm">Check OTP</button>
                    <button onclick="cancelNumber('{{ num.activation_id }}')" 
                            class="flex-1 bg-red-600 hover:bg-red-700 py-2 rounded-xl text-sm">Cancel</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
